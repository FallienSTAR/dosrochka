<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=Unbounded:wght@700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#2B45C8}
  .wrap{position:relative;width:1200px;height:630px;font-family:"Golos Text",system-ui,sans-serif;background:#2B45C8}
  .word{position:absolute;left:80px;top:118px;font-family:"Unbounded",sans-serif;font-weight:700;font-size:92px;color:#fff;letter-spacing:-0.02em;line-height:1}
  .tag{position:absolute;left:80px;top:262px;width:560px;font-size:30px;line-height:1.5;color:#fff;font-weight:400}

  .scene{position:absolute;left:700px;top:150px;width:440px;height:340px}
  .card{position:absolute;background:#fff;border-radius:28px;box-shadow:0 30px 60px rgba(11,20,60,.35)}

  .calc{width:270px;height:320px;left:10px;top:20px;transform:rotate(-7deg);padding:26px}
  .calc .screen{width:100%;height:70px;border:5px solid #2B45C8;border-radius:16px}
  .calc .grid{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .calc .key{height:44px;border-radius:12px;background:#B9C4FF}
  .calc .key.op{background:#3FCB93}

  .doc{width:230px;height:300px;left:190px;top:0;transform:rotate(6deg);padding:28px 24px}
  .doc .line{height:14px;border-radius:8px;background:#C7D0FF;margin-bottom:16px}
  .doc .line.short{width:60%}
  .doc .bars{display:flex;align-items:flex-end;gap:10px;height:80px;margin-top:26px}
  .doc .bars i{display:block;flex:1;border-radius:6px 6px 2px 2px;background:#2B45C8}

  .badge{position:absolute;left:330px;top:-18px;width:110px;height:110px;border-radius:50%;background:#3FCB93;box-shadow:0 18px 34px rgba(11,20,60,.35);display:flex;align-items:center;justify-content:center}
  .spark{position:absolute;left:452px;top:-4px;width:60px;height:70px}
</style>
</head>
<body>
<div class="wrap">
  <div class="word">Привет!</div>
  <div class="tag">Я — бот-калькулятор, который поможет досрочно погасить долги по любым займам.</div>

  <div class="scene">
    <div class="card calc">
      <div class="screen"></div>
      <div class="grid">
        <div class="key"></div><div class="key"></div><div class="key op"></div>
        <div class="key"></div><div class="key"></div><div class="key op"></div>
        <div class="key"></div><div class="key"></div><div class="key op"></div>
      </div>
    </div>
    <div class="card doc">
      <div class="line"></div>
      <div class="line short"></div>
      <div class="line"></div>
      <div class="bars">
        <i style="height:90%"></i><i style="height:60%"></i><i style="height:75%"></i><i style="height:35%"></i>
      </div>
    </div>
    <div class="badge">
      <svg width="56" height="56" viewBox="0 0 56 56"><path d="M14 29l9 9 19-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <svg class="spark" viewBox="0 0 60 70">
      <line x1="8" y1="52" x2="0" y2="64" stroke="#B9C4FF" stroke-width="6" stroke-linecap="round"/>
      <line x1="24" y1="42" x2="20" y2="58" stroke="#B9C4FF" stroke-width="6" stroke-linecap="round"/>
      <line x1="42" y1="46" x2="46" y2="60" stroke="#B9C4FF" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
</div>
</body>
</html>
